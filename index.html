<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Brisbane Transit & Zoning Feasibility</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Esri Leaflet Geocoder CSS (Address Search) -->
    <link rel="stylesheet" href="https://unpkg.com/esri-leaflet-geocoder@3.1.4/dist/esri-leaflet-geocoder.css" />

    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; }
        #map { height: 100%; width: 100%; }

        /* Custom Legend Styling */
        .legend {
            background: white;
            padding: 10px 14px;
            font-family: Arial, sans-serif;
            font-size: 13px;
            line-height: 18px;
            color: #333;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }
        .legend h4 {
            margin: 0 0 8px;
            font-size: 14px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 4px;
        }
        .legend-color {
            width: 18px;
            height: 18px;
            margin-right: 8px;
            border-radius: 3px;
            border: 1px solid #666;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Esri Leaflet & Geocoder JS (Address Search) -->
    <script src="https://unpkg.com/esri-leaflet@3.0.12/dist/esri-leaflet.js"></script>
    <script src="https://unpkg.com/esri-leaflet-geocoder@3.1.4/dist/esri-leaflet-geocoder.js"></script>

    <script>
        // Bypass local OpenStreetMap tile restrictions
        L.TileLayer.prototype.options.referrerPolicy = 'strict-origin-when-cross-origin';

        // 1. DEFINE BASE MAPS (Using keyless public providers)
        var osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        });

        // Stamen / Stadia toner-lite (Clean minimal grayscale/light style)
        var lightMatterLayer = L.tileLayer('https://tiles.stadiamaps.com/tiles/stamen_toner_lite/{z}/{x}/{y}{r}.png', {
            maxZoom: 20,
            attribution: '&copy; <a href="https://stadiamaps.com/">Stadia Maps</a>, &copy; <a href="https://stamen.com/">Stamen Design</a>, &copy; <a href="https://openmaptiles.org/">OpenMapTiles</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        });

        // Esri World Gray Canvas (Clean modern dark/gray theme alternative)
        var darkMatterLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 16,
            attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ'
        });

        // Initialize map centered over Brisbane with OpenStreetMap as default
        var map = L.map('map', {
            layers: [osmLayer]
        }).setView([-27.4698, 153.0251], 12);

        // Group base layers for the toggle control
        var baseLayers = {
            "OpenStreetMap": osmLayer,
            "Light Minimal": lightMatterLayer,
            "Esri Dark Gray": darkMatterLayer
        };

        var overlayLayers = {};

        // Add Layer Control panel
        var layerControl = L.control.layers(baseLayers, overlayLayers, {collapsed: false}).addTo(map);

        // 2. ADD ADDRESS SEARCH CONTROL
        var searchControl = L.esri.Geocoding.geosearch({
            position: 'topleft',
            placeholder: 'Search Brisbane address or suburb...',
            useMapBounds: false
        }).addTo(map);

        var searchResults = L.layerGroup().addTo(map);

        searchControl.on('results', function (data) {
            searchResults.clearLayers();
            for (var i = data.results.length - 1; i >= 0; i--) {
                searchResults.addLayer(L.marker(data.results[i].latlng));
            }
        });

        fetch('Station_buffers.geojson')
            .then(response => {
                if (!response.ok) throw new Error('Failed to load Station_buffers.geojson');
                return response.json();
            })
