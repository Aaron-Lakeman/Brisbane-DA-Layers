<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Brisbane Transit & Zoning Feasibility</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Esri Leaflet Geocoder CSS (Address Search) -->
    <link rel="stylesheet" href="https://unpkg.com/esri-leaflet-geocoder@3.1.4/dist/esri-leaflet-geocoder.css" />

    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; }
        #map { height: 100%; width: 100%; }

        /* Custom Legend Styling */
        .legend {
            background: white;
            padding: 10px 14px;
            font-family: Arial, sans-serif;
            font-size: 13px;
            line-height: 18px;
            color: #333;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }
        .legend h4 {
            margin: 0 0 8px;
            font-size: 14px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 4px;
        }
        .legend-color {
            width: 18px;
            height: 18px;
            margin-right: 8px;
            border-radius: 3px;
            border: 1px solid #666;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Esri Leaflet & Geocoder JS (Address Search) -->
    <script src="https://unpkg.com/esri-leaflet@3.0.12/dist/esri-leaflet.js"></script>
    <script src="https://unpkg.com/esri-leaflet-geocoder@3.1.4/dist/esri-leaflet-geocoder.js"></script>

    <script>
        // Bypass local OpenStreetMap tile restrictions
        L.TileLayer.prototype.options.referrerPolicy = 'strict-origin-when-cross-origin';

        // 1. DEFINE GUARANTEED KEYLESS BASE MAPS
        var osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        });

        var esriDarkLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 16,
            attribution: 'Tiles &copy; Esri'
        });

        var esriWorldImagery = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 18,
            attribution: 'Tiles &copy; Esri'
        });

        // Initialize map centered over Brisbane with OpenStreetMap as default
        var map = L.map('map', {
            layers: [osmLayer]
        }).setView([-27.4698, 153.0251], 12);

        // Group base layers for the toggle control
        var baseLayers = {
            "OpenStreetMap (Standard)": osmLayer,
            "Esri Dark Gray": esriDarkLayer,
            "Esri Satellite Imagery": esriWorldImagery
        };

        var overlayLayers = {};

        // Add Layer Control panel
        var layerControl = L.control.layers(baseLayers, overlayLayers, {collapsed: false}).addTo(map);

        // 2. ADD ADDRESS SEARCH CONTROL
        var searchControl = L.esri.Geocoding.geosearch({
            position: 'topleft',
            placeholder: 'Search Brisbane address or suburb...',
            useMapBounds: false
        }).addTo(map);
