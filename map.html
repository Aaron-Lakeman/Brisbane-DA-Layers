<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Brisbane Spatial Feasibility Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 1. Leaflet CSS styling for the map interface -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; }
        #map { height: 100%; width: 100%; }
    </style>
</head>
<body>

    <!-- 2. The canvas container where the map is drawn -->
    <div id="map"></div>

    <!-- 3. Leaflet JavaScript library -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize the map centered over Brisbane
        var map = L.map('map').setView([-27.4698, 153.0251], 12);

        // Add the free OpenStreetMap background tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Object to hold layers for the toggle menu
        var overlayLayers = {};

        // 4A. Load your Zoning GeoJSON file
        fetch('zoning.geojson')
            .then(response => response.json())
            .then(data => {
                var zoningLayer = L.geoJSON(data, {
                    style: { color: "#3388ff", weight: 1, fillOpacity: 0.4 }
                }).addTo(map);
                overlayLayers["LMR Zoning"] = zoningLayer;
                
                // Add the interactive layer toggle box to the top-right
                L.control.layers(null, overlayLayers, {collapsed: false}).addTo(map);
            });

        // 4B. Load your Bus Stops GeoJSON file
        fetch('stops.geojson')
            .then(response => response.json())
            .then(data => {
                var stopsLayer = L.geoJSON(data, {
                    pointToLayer: function (feature, latlng) {
                        return L.circleMarker(latlng, {
                            radius: 5,
                            fillColor: "crimson",
                            color: "#fff",
                            weight: 1,
                            fillOpacity: 0.8
                        });
                    }
                }).addTo(map);
                overlayLayers["Bus Stops"] = stopsLayer;
            });
    </script>
</body>
</html>
